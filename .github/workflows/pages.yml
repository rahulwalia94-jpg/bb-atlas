name: Deploy BB Atlas to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # A commit made by the refresh bot uses GITHUB_TOKEN, which by design does
  # NOT trigger `push`. Without this, refreshed data lands in the repo but
  # never reaches the live site.
  workflow_run:
    workflows: ["Weekly live-data refresh"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild content indexes (QA gate)
        run: node scripts/build-indexes.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
